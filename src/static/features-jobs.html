<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurea — Job board</title>
  <meta name="description" content="Aurea scores your CV like an ATS, tailors it to each job without inventing anything, and writes your cover letter.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app.css">
</head>
<body data-page="landing" data-section="features-jobs">
  <main>
    <section class="landing-section">
      <article class="feature">
        <div>
          <h1 class="section-title" data-i18n="landing.feat_jobs">Job board</h1>
          <p class="secondary-text" data-i18n="landing.feat_jobs_body">Remote jobs ranked by how well they match your CV, one click away from a tailored application.</p>
          <a href="evaluator.html" class="btn-secondary" data-i18n="landing.try_it">Try it</a>
        </div>
        <div class="feature-visual" aria-hidden="true">
          <div class="fv-scene">
            <div class="fv-glow"></div>
            <div class="fv-floor"></div>
            <div class="fv-tile"></div>
            <svg class="fv-glyph" viewBox="0 0 100 100">
              <defs><linearGradient id="fv-g" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="90" y2="90"><stop offset="0" stop-color="#FFA590"/><stop offset=".5" stop-color="#FDE08A"/><stop offset="1" stop-color="#8FF0DF"/></linearGradient></defs>
              <g fill="none" stroke="url(#fv-g)" stroke-width="6" stroke-linejoin="round">
                <rect x="18" y="34" width="64" height="44" rx="8"/>
                <path d="M38 34V27a5 5 0 0 1 5-5h14a5 5 0 0 1 5 5v7"/>
                <line x1="18" y1="53" x2="82" y2="53"/>
              </g>
            </svg>
            <span class="fv-pill fv-pill--br fv-pill--good">92% <span data-i18n="jobs.match">match</span></span>
          </div>
        </div>
      </article>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shell.js"></script>
  <script src="feature-visual.js"></script>
</body>
</html>
