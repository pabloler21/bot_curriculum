<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurea — Adapter</title>
  <meta name="description" content="Aurea scores your CV like an ATS, tailors it to each job without inventing anything, and writes your cover letter.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app.css">
</head>
<body data-page="landing" data-section="features-adapter">
  <main>
    <section class="landing-section">
      <article class="feature">
        <div>
          <h1 class="section-title" data-i18n="landing.feat_adapter">Adapter</h1>
          <p class="secondary-text" data-i18n="landing.feat_adapter_body">Paste a job link or description and get a CV tailored to the role, the skill gaps to work on, and a cover letter.</p>
          <ul>
            <li data-i18n="landing.feat_adapter_1">No invented experience — every line traces back to your CV</li>
            <li data-i18n="landing.feat_adapter_2">Cover letter and interview prep</li>
            <li data-i18n="landing.feat_adapter_3">PDF ready to send</li>
          </ul>
          <a href="evaluator.html" class="btn-secondary" data-i18n="landing.try_it">Try it</a>
        </div>
        <div class="feature-visual" aria-hidden="true">
          <div class="fv-scene">
            <div class="fv-glow"></div>
            <div class="fv-floor"></div>
            <div class="fv-tile"></div>
            <svg class="fv-glyph" viewBox="0 0 100 100">
              <defs><linearGradient id="fv-g" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="90" y2="90"><stop offset="0" stop-color="#FFA590"/><stop offset=".5" stop-color="#FDE08A"/><stop offset="1" stop-color="#8FF0DF"/></linearGradient></defs>
              <g fill="none" stroke="url(#fv-g)" stroke-width="6" stroke-linecap="round">
                <rect x="24" y="16" width="46" height="64" rx="7"/>
                <line class="fv-line" x1="34" y1="34" x2="60" y2="34"/>
                <line class="fv-line" x1="34" y1="46" x2="54" y2="46"/>
                <line class="fv-line" x1="34" y1="58" x2="58" y2="58"/>
              </g>
              <path class="fv-spark" d="M72 11Q72 22 83 22Q72 22 72 33Q72 22 61 22Q72 22 72 11Z" fill="url(#fv-g)"/>
            </svg>
            <span class="fv-pill fv-pill--bl fv-pill--accent">+ Python · SQL</span>
          </div>
        </div>
      </article>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shell.js"></script>
  <script src="feature-visual.js"></script>
</body>
</html>
