name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          
      - name: Install dependencies
        run: uv sync --dev
        
      - name: Run linter (Ruff)
        run: uv run ruff check .
        
      - name: Run tests (Pytest)
        run: uv run pytest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TESTING: "true"

  deploy:
    name: Deploy to production VPS
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Two merges in a row must not deploy on top of each other.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Run deploy script over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The key is pinned to a forced command in authorized_keys, so the
          # server runs /home/deploy/deploy.sh no matter what is sent here.
          script: /home/deploy/deploy.sh

      - name: Health check
        run: |
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 20 https://aurea.pablolerner.dev/health; then
              echo ""
              echo "Healthy after ${attempt} attempt(s)."
              exit 0
            fi
            echo "Attempt ${attempt} failed, retrying in 6s…"
            sleep 6
          done
          echo "Health check never passed — production may be down."
          exit 1
